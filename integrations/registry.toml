version = 1

[integrations.ores_otel]
source = "https://github.com/ores-otel"
role = "OpenTelemetry traces, metrics, logs"
env = ["ORES_OTEL_EXPORTER_OTLP_ENDPOINT", "ORES_OTEL_SERVICE_NAME"]

[integrations.ores_forms]
source = "https://github.com/ores-forms"
role = "shared form schemas and client rendering"
env = ["ORES_FORMS_API_URL"]

[integrations.opto_sync]
source = "https://github.com/opto-sync"
role = "offline/durable synchronization envelopes"
env = ["OPTO_SYNC_API_URL"]

[integrations.ores_chat]
source = "https://github.com/ores-chat"
role = "chat transport/service integration"
env = ["ORES_CHAT_API_URL"]

[integrations.ores_convo]
source = "https://github.com/ores-convo"
role = "encrypted conversation service integration"
env = ["ORES_CONVO_API_URL"]

[integrations.ores_rate_limit]
source = "https://github.com/ores-rate-limit"
role = "distributed request admission and quotas"
env = ["ORES_RATE_LIMIT_API_URL"]

[integrations.ores_middleware]
source = "https://github.com/ORESoftware/ores-middleware"
role = "shared P2/P3 middleware policy and dependency injection"
env = ["ORES_MIDDLEWARE_PROFILE"]

[integrations.ores_redis_lru_cache]
source = "https://github.com/ores-redis-lru-cache"
role = "shared Redis-backed LRU cache"
env = ["ORES_REDIS_LRU_API_URL"]

[integrations.api_docs]
source = "https://github.com/ORESoftware/api-docs"
role = "route, RPC, GraphQL and documentation contract authority"
env = ["API_DOCS_ROUTE_MAP"]

[integrations.ores_sops_cli]
source = "https://github.com/ORESoftware/ores-sops"
role = "SOPS/age secret tooling"
env = ["SOPS_AGE_KEY_FILE", "SOPS_AGE_RECIPIENTS"]

[integrations.ores_sops_org]
source = "https://github.com/ores-sops"
role = "shared SOPS policy/runtime family"
env = ["ORES_SOPS_MANIFEST"]
