# flags-2-env config — https://github.com/ORESoftware/flags-2-env
#
# This file is the CLI contract. The binary parses it directly on every
# platform, and `--help`, shell completions, env-var names, types, and defaults
# all render from it at runtime — there is no second copy in Rust to drift.

[help]
url = "https://github.com/scintilla-run/scintilla-cli"
columns = ["options", "env", "type", "default", "description"]

[parse]
stop_at_first_positional = false
allow_unknown = false

[env]
ignore = ["SCINTILLA_TOKEN"]

[commands.build]
help = "Discover .scintilla-endpoint.toml files and emit a deterministic project build manifest."

[commands.build.flags.project]
env = "SCINTILLA_BUILD_PROJECT"
aliases = ["project"]
type = "string"
default = "."
help = "Project root containing endpoint directories."

[commands.build.flags.out-dir]
env = "SCINTILLA_BUILD_OUT"
aliases = ["out-dir"]
type = "string"
default = ".scintilla"
help = "Project-relative generated build directory."

[commands.build.flags.check]
env = "SCINTILLA_BUILD_CHECK"
aliases = ["check"]
type = "bool"
default = false
help = "Verify generated endpoint definitions/manifests are current without writing them."

[commands.benchmark]
help = "Execute provider-neutral performance/cost benchmark drivers and validate fresh receipts."

[commands.benchmark.flags.root]
env = "SCINTILLA_BENCHMARK_ROOT"
aliases = ["root"]
type = "string"
default = "."
help = "Benchmark project root. Plan, receipt, and aggregate paths are confined below it."

[commands.benchmark.flags.plan]
env = "SCINTILLA_BENCHMARK_PLAN"
aliases = ["plan"]
type = "string"
help = "ores.provider-benchmark.plan/v1 JSON plan, relative to --root."

[commands.benchmark.flags.out]
env = "SCINTILLA_BENCHMARK_OUT"
aliases = ["out"]
type = "string"
help = "Optional aggregate receipt output path, relative to --root. Must not already exist."

[commands.benchmark.flags.check]
env = "SCINTILLA_BENCHMARK_CHECK"
aliases = ["check"]
type = "bool"
default = false
help = "Validate the plan and command declarations without executing benchmark drivers."

[commands.deploy]
help = "Deploy a previously built Scintilla endpoint project to the configured control plane."

[commands.deploy.flags.project]
env = "SCINTILLA_DEPLOY_PROJECT"
aliases = ["project"]
type = "string"
default = "."
help = "Project root containing the built Scintilla project."

[commands.deploy.flags.out-dir]
env = "SCINTILLA_DEPLOY_OUT"
aliases = ["out-dir"]
type = "string"
default = ".scintilla"
help = "Project-relative build directory containing scintilla-project.json."

[commands.deploy.flags.dry-run]
env = "SCINTILLA_DEPLOY_DRY_RUN"
aliases = ["dry-run"]
type = "bool"
default = false
help = "Validate the built project and print create/replace actions without mutating the control plane."

[commands.dev]
help = "Continuously build endpoint contracts and synchronize them to a loopback Scintilla control plane."

[commands.dev.flags.project]
env = "SCINTILLA_DEV_PROJECT"
aliases = ["project"]
type = "string"
default = "."
help = "Project root containing .scintilla-endpoint.toml endpoint directories."

[commands.dev.flags.out-dir]
env = "SCINTILLA_DEV_OUT"
aliases = ["out-dir"]
type = "string"
default = ".scintilla"
help = "Project-relative generated build directory."

[commands.dev.flags.poll-ms]
env = "SCINTILLA_DEV_POLL_MS"
aliases = ["poll-ms"]
type = "integer"
default = 250
help = "Correctness-first polling interval in milliseconds (50 through 60000)."

[commands.dev.flags.once]
env = "SCINTILLA_DEV_ONCE"
aliases = ["once"]
type = "bool"
default = false
help = "Build and synchronize one generation, then exit. Useful for CI and dev smoke tests."

[commands.docs]
help = "Generate deterministic API and MCP docs from the project-local .api-docs.toml and route map."

[commands.module-interfaces]
help = "Generate native module-interface projections from ./module-interface-codegen.json using the shared ORESoftware/api-docs renderer."

[commands.functions]
help = "List the functions this token can see."
aliases = ["ls"]

[commands.invoke]
help = "Invoke a function, a specific revision, or an alias."

[commands.invoke.flags.payload]
env = "SCINTILLA_PAYLOAD"
aliases = ["payload"]
short = "p"
type = "json"
default = "{}"
help = "JSON payload passed to the function."

[commands.invoke.flags.payload-file]
env = "SCINTILLA_PAYLOAD_FILE"
aliases = ["payload-file"]
type = "string"
help = "Read the JSON payload from this file instead of --payload."

[commands.invoke.flags.revision]
env = "SCINTILLA_REVISION"
aliases = ["revision"]
type = "integer"
help = "Invoke this revision number instead of the function's current definition."

[commands.invoke.flags.alias]
env = "SCINTILLA_ALIAS"
aliases = ["alias"]
type = "string"
help = "Invoke through this alias, honouring its traffic split."

[commands.revisions]
help = "List a function's revisions."

[commands.publish]
help = "Publish a new revision of a function."

[commands.publish.flags.description]
env = "SCINTILLA_DESCRIPTION"
aliases = ["description"]
short = "m"
type = "string"
help = "Description recorded on the new revision."

[commands.validate]
help = "Validate a function definition against the shared contract — offline."

[commands.validate.flags.file]
env = "SCINTILLA_DEFINITION_FILE"
aliases = ["file"]
short = "f"
type = "string"
help = "Path to the function definition JSON to validate."

[commands.completion]
help = "Print a shell completion script for this CLI."

[commands.completion.flags.shell]
env = "SCINTILLA_COMPLETION_SHELL"
aliases = ["shell"]
short = "s"
type = "string"
default = "bash"
help = "Shell dialect to emit: bash or zsh."

[flags.url]
env = "SCINTILLA_BASE_URL"
aliases = ["url"]
short = "u"
type = "string"
default = "https://api.scintilla.run"
help = "Base URL of the Scintilla control plane."

[flags.function]
env = "SCINTILLA_FUNCTION"
aliases = ["function"]
type = "string"
help = "Function id or slug. Required by invoke, revisions, and publish."

[flags.timeout]
env = "SCINTILLA_TIMEOUT_MS"
aliases = ["timeout"]
short = "t"
type = "integer"
default = 30000
help = "Per-request timeout in milliseconds (100 through 600000)."

[flags.json]
env = "SCINTILLA_JSON"
aliases = ["json"]
short = "j"
type = "bool"
default = false
true_aliases = ["1", "yes", "on"]
false_aliases = ["0", "no", "off"]
help = "Emit machine-readable JSON instead of the human table."
