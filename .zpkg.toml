[package]
org = "oresoftware"
name = "ores-comparisons"
version = "0.1.0"
description = "Cross-stack conformance and deployment comparison harness"
language = "mixed"

[package.repository]
vcs = "git"
url = "https://github.com/ORESoftware/ores-comparisons"

[dependencies]
"oresoftware/ores-compose" = "=0.1.0"
"oresoftware/typespec-json-schema-validator" = "=0.1.1"

[interop.git]
consume_gitmodules = true

[targets.contracts]
dir = "shared"
name = "ores-comparisons-contracts"
adapter = "none"

[targets.conformance]
dir = "conformance"
name = "ores-comparisons-conformance"
adapter = "none"

[scripts]
test = "python3 scripts/verify_examples.py && python3 scripts/verify_dummy_org_map.py && python3 scripts/verify_toolchain_pins.py && bash conformance/check-all.sh"
