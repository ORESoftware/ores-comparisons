version = 1
name = "big-org-example-operations"
stack = "beamscale"
scenario = "operations"
integration_manifest = "../../../../integrations.toml"

[contracts]
typespec = "../../../../contracts/big-org-example.tsp"
json_schema = "../../../../contracts/big-org-example.schema.json"

[environment]
encrypted_dir = "../../env/enc"
decrypted_dir = "../../env/dec"

[deploy]
build = "bmscl build . --out-dir dist"
verify = "bmscl verify dist"
deploy = "bmscl deploy dist --project big-org-example-operations --environment dev"

[features]
otel = true
forms = true
sync = true
chat = true
convo = true
rate_limit = true
middleware = true
redis_lru = true
rpc_docs = true
sops_age = true
