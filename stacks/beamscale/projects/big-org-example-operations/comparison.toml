version = 1
stack = "beamscale"
scenario = "big-org-example-operations"
integrations = ["ores_otel", "ores_forms", "opto_sync", "ores_chat", "ores_convo", "ores_rate_limit", "ores_middleware", "ores_redis_lru_cache", "api_docs", "ores_sops_legacy", "ores_sops_org"]

[commands]
dev = "bmscl dev ."
build = "bmscl build . --out-dir ./dist --policy ./bmscl-policy.toml --worker-config ./.ores-lambda.toml"
verify = "bmscl verify ./dist"
deploy = "bmscl deploy ./dist --project big-org-example-operations --environment dev"

[contracts]
typespec = "contracts/typespec/main.tsp"
json_schema = "contracts/json-schema/domain.schema.json"

[secrets]
encrypted_dir = "env/enc"
decrypted_dir = "env/dec"

[integration_adapters]
ores_otel = "ctx.log -> ores-otel host bridge"
ores_forms = "trusted P2 same-cluster/platform adapter"
opto_sync = "trusted P2 same-cluster/platform adapter"
ores_chat = "trusted P2 same-cluster/platform adapter"
ores_convo = "trusted P2 same-cluster/platform adapter"
ores_rate_limit = "ores-middleware P2 host stage"
ores_middleware = "host-owned dependency injection middleware"
ores_redis_lru_cache = "trusted P2 cache adapter"
api_docs = "local TypeSpec/JSON Schema + api-docs operation contract"
ores_sops_legacy = "sops-age-dotenv"
ores_sops_org = "sops-age-dotenv-org-target"
