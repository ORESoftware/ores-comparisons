[package]
name = "ores-comparison-forms-chat-workflow"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
ores-api-docs-client = { git = "https://github.com/ORESoftware/api-docs.git", rev = "be96f3eaa6e8e1764b3ac6b79055a5b08d5b9bdc", package = "ores-api-docs-client" }
ores-api-docs-macros = { git = "https://github.com/ORESoftware/api-docs.git", rev = "be96f3eaa6e8e1764b3ac6b79055a5b08d5b9bdc", package = "ores-api-docs-macros" }
ores-middleware = { git = "https://github.com/ORESoftware/ores-middleware.git", rev = "5eb764fd9538f1dfcac0ef9fd183768da0852cd0", package = "ores-middleware" }

[build-dependencies]
ores-api-docs = { git = "https://github.com/ORESoftware/api-docs.git", rev = "be96f3eaa6e8e1764b3ac6b79055a5b08d5b9bdc", package = "ores-api-docs", default-features = false }
