version = 1
stack = "ores-stack"
scenario = "forms-chat-workflow"
integrations = ["ores_otel", "ores_forms", "opto_sync", "ores_chat", "ores_convo", "ores_rate_limit", "ores_middleware", "ores_redis_lru_cache", "api_docs", "ores_sops_legacy", "ores_sops_org"]

[commands]
dev = "ores-stack dev"
build = "ores-stack check && ores-stack build"
deploy = "ores-stack build # hand resulting immutable package to the selected deployment target"

[integration_adapters]
ores_otel = "ores-middleware/ores-otel port"
ores_forms = "typed HTTP/RPC adapter"
opto_sync = "typed HTTP/RPC adapter"
ores_chat = "typed HTTP/RPC adapter"
ores_convo = "typed HTTP/RPC adapter"
ores_rate_limit = "ores-middleware rate-limit port"
ores_middleware = "native ores-middleware crate"
ores_redis_lru_cache = "Redis/LRU adapter port"
api_docs = "ORESoftware/api-docs route map + generated router"
ores_sops_legacy = "sops-age-dotenv"
ores_sops_org = "sops-age-dotenv-org-target"
