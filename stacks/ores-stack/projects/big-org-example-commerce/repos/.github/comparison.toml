version = 1
stack = "ores-stack"
scenario = "big-org-example-commerce"
integrations = ["ores_otel", "ores_forms", "opto_sync", "ores_chat", "ores_convo", "ores_rate_limit", "ores_middleware", "ores_redis_lru_cache", "api_docs", "ores_sops_legacy", "ores_sops_org"]

[commands]
dev = "cd repos/app && ores-stack dev"
build = "cd repos/app && ores-stack check && ores-stack build"
serve = "cd repos/app && cargo run --release --locked"
deploy = "cd repos/app && ores-stack build # hand immutable server/lambda package to the selected deployment target"

[contracts]
typespec = "contracts/typespec/main.tsp"
json_schema = "contracts/json-schema/domain.schema.json"
route_map = "repos/app/contracts/service.route-map.json"
rpc_projection = "api-docs v1 unary + RIDL-compatible semantic operation identities"
graphql_projection = "api-docs GraphQL resolver projection at /v1/graphql"

[secrets]
encrypted_dir = "env/enc"
decrypted_dir = "env/dec"

[integration_adapters]
ores_otel = "ores-middleware/ores-otel port"
ores_forms = "typed HTTP/RPC form adapter"
opto_sync = "typed HTTP/RPC sync adapter"
ores_chat = "typed HTTP/RPC chat adapter"
ores_convo = "typed encrypted-conversation adapter"
ores_rate_limit = "ores-middleware rate-limit port"
ores_middleware = "native approved dependency injection boundary"
ores_redis_lru_cache = "Redis/LRU adapter port"
api_docs = "route map + RPC/OpenAPI/OpenRPC/GraphQL projection authority"
ores_sops_legacy = "sops-age-dotenv"
ores_sops_org = "sops-age-dotenv-org-target"
