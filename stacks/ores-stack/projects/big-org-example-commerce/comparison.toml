version = 1
name = "big-org-example-commerce"
stack = "ores-stack"
scenario = "commerce"
integration_manifest = "../../../../integrations.toml"

[contracts]
typespec = "../../../../contracts/big-org-example.tsp"
json_schema = "../../../../contracts/big-org-example.schema.json"

[environment]
encrypted_dir = "../../env/enc"
decrypted_dir = "../../env/dec"

[deploy]
check = "ores-stack check"
build = "ores-stack build"
deploy = "cargo run --release --locked"

[features]
otel = true
forms = true
sync = true
chat = true
convo = true
rate_limit = true
middleware = true
redis_lru = true
rpc_docs = true
sops_age = true
