version = 1
pages_dir = "src/pages"
out_dir = ".ores-stack"
dist_dir = "dist"
strict = true
api_docs_route_map = "contracts/service.route-map.json"

[build]
contracts = []
client_mash = []
client_leptos = []
client_dioxus = []
server = ["cargo", "build", "--release"]
prerender = []
package = []

[dev]
preflight = ["cargo", "check"]
server = ["cargo", "run"]
watch = ["src", "contracts", "Cargo.toml", ".ores-stack.toml"]
ignore = [".git", ".ores-stack", "target", "dist"]
cargo_target_dir = "target"
reload_bind = "127.0.0.1:36303"
browser_reload = true
