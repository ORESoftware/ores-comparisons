schema_version: ores.compose.v1
project: comparescintillabigcommerce
allow_lazy_start: false
services:
  postgres:
    runtime: host
    command: ["bash", "scripts/postgres-local.sh"]
    healthcheck:
      command: ["bash", "scripts/db-health.sh"]
      interval_ms: 300
      timeout_ms: 250
      retries: 20
  runner:
    runtime: host
    command: ["bash", "scripts/scintilla-runner.sh"]
    build:
      - ["bash", "scripts/scintilla-runtime-build.sh", "runner"]
    healthcheck:
      command: ["curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8083/readyz"]
      interval_ms: 500
      timeout_ms: 400
      retries: 20
  backend:
    runtime: host
    command: ["bash", "scripts/scintilla-backend.sh"]
    build:
      - ["bash", "scripts/scintilla-runtime-build.sh", "backend"]
    depends_on: [runner]
    healthcheck:
      command: ["curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/readyz"]
      interval_ms: 500
      timeout_ms: 400
      retries: 20
  db-bootstrap:
    runtime: host
    command: ["bash", "scripts/db-bootstrap.sh"]
    build:
      - ["bash", "scripts/contracts-check.sh"]
      - ["bash", "scripts/db-migrate.sh"]
      - ["bash", "scripts/db-seed.sh"]
    depends_on: [postgres]
    healthcheck:
      command: ["bash", "scripts/db-bootstrap-health.sh"]
      interval_ms: 200
      timeout_ms: 200
      retries: 20
  catalog-service:
    runtime: host
    command: ["python3", "scripts/run-sibling.py", "run", "catalog-service"]
    build:
      - ["python3", "scripts/run-sibling.py", "build", "catalog-service"]
    depends_on: ["backend", "db-bootstrap"]
  orders-worker:
    runtime: host
    command: ["python3", "scripts/run-sibling.py", "run", "orders-worker"]
    build:
      - ["python3", "scripts/run-sibling.py", "build", "orders-worker"]
    depends_on: ["backend", "db-bootstrap", "catalog-service"]
  storefront-web:
    runtime: host
    command: ["python3", "scripts/run-sibling.py", "run", "storefront-web"]
    build:
      - ["python3", "scripts/run-sibling.py", "build", "storefront-web"]
    depends_on: ["backend", "db-bootstrap", "catalog-service"]
  app:
    runtime: host
    command: ["bash", "scripts/dev-server.sh"]
    depends_on: ["backend", "db-bootstrap", "catalog-service", "orders-worker", "storefront-web"]
