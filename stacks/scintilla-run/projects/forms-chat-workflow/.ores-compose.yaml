schema_version: ores.compose.v1
project: scintilla-forms-chat-workflow
allow_lazy_start: false
services:
  postgres:
    runtime: host
    command: ["../../../../scripts/local-postgres.sh", "scintilla-forms-chat-workflow"]
    healthcheck:
      command: ["../../../../scripts/local-postgres-health.sh", "scintilla-forms-chat-workflow"]
      interval_ms: 1000
      timeout_ms: 1000
      retries: 20
  scintilla-control-plane:
    name: scintilla
    runtime: host
    command: ["../../../../scripts/scintilla-control-plane.sh"]
    healthcheck:
      command: ["../../../../scripts/scintilla-health.sh"]
      interval_ms: 5000
      timeout_ms: 1000
      retries: 20
  app:
    runtime: host
    command: ["../../../../scripts/dev-project.sh", "scintilla-run", "."]
    depends_on: ["postgres", "scintilla"]
