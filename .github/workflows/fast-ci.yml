name: fast-ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify compiler/runtime tests
        run: mvn -B -ntp verify
      - name: Run examples
        run: |
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"
      - name: Audit mirrored data-science source
        run: |
          cd integration/oreslang-data-science
          sh scripts/verify-source-invariants.sh
      - name: Run mirrored data-science native suites
        run: |
          mvn -B -ntp -DskipTests exec:java -Dexec.args="integration/oreslang-data-science/tests/main.ores"
          mvn -B -ntp -DskipTests exec:java -Dexec.args="integration/oreslang-data-science/tests/embeddings.ores"
