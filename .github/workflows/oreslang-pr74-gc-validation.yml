name: oreslang-pr74-gc-validation

on:
  push:
    branches: ["ci/oreslang-pr74-gc-validation"]

concurrency:
  group: oreslang-pr74-gc-validation
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: _ci/oreslang-pr57-full

jobs:
  gc-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: GC and actor-isolation focused tests
        run: >-
          mvn -B -ntp
          -Dtest=GarbageCollectionHardeningTest,ActorRuntimeTest,ActorTransportHardeningTest,PrivateActorIsolationTest,SharedPrivateActorIsolationProofTest,OreslangActorIsolationExampleTest
          test

  full-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Runtime diagnostics
        run: |
          java --version
          mvn --version
      - name: Compile and test exact Oreslang PR 74 snapshot
        run: mvn -B -ntp test
