name: oreslang-mutex-publication-atomicity
# exact Oreslang source head: 89ccc80d869bb404c6b9eafa60c2c1bc9c0ced4b

on:
  push:
    branches: ["ci/oreslang-mutex-publication-atomicity"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: _ci/oreslang-pr51-full

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation mirror
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Runtime diagnostics
        run: |
          java --version
          mvn --version

      - name: Full Maven verification
        run: mvn -B -ntp verify
