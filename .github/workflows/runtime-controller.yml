name: runtime-controller-validation

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-controller.yml"
      - ".github/workflows/runtime-all-18.yml"
      - ".github/workflows/runtime-project.yml"
      - "scripts/prove_runtime_project.py"
      - "tests/test_runtime_proof.py"
      - "scripts/bootstrap_pinned_tools.sh"
      - "tools/toolchain.lock.json"
      - "tools/README.md"
      - "shared/project-matrix.json"
      - ".gitmodules"
      - "stacks/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-controller.yml"
      - ".github/workflows/runtime-all-18.yml"
      - ".github/workflows/runtime-project.yml"
      - "scripts/prove_runtime_project.py"
      - "tests/test_runtime_proof.py"
      - "scripts/bootstrap_pinned_tools.sh"
      - "tools/toolchain.lock.json"
      - "tools/README.md"
      - "shared/project-matrix.json"
      - ".gitmodules"
      - "stacks/**"

permissions:
  contents: read

concurrency:
  group: runtime-controller-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate proof harness and exact 18-project authority
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prove_runtime_project.py
          python3 -m unittest tests.test_runtime_proof
          python3 scripts/verify_project_matrix.py
          python3 - <<'PY'
          import json
          matrix = json.load(open("shared/project-matrix.json"))
          projects = matrix["projects"]
          stacks = {"beamscale", "scintilla-run", "ores-stack"}
          scenarios = {
              "cached-rpc",
              "http-observability",
              "forms-chat-workflow",
              "big-org-example-commerce",
              "big-org-example-collaboration",
              "big-org-example-operations",
          }
          assert len(projects) == 18, len(projects)
          assert {p["stack"] for p in projects} == stacks
          assert {p["scenario"] for p in projects} == scenarios
          for scenario in scenarios:
              actual = {p["stack"] for p in projects if p["scenario"] == scenario}
              assert actual == stacks, (scenario, actual)
          print("runtime controller OK: exact authority is 6 waves x 3 stacks = 18 projects")
          PY
      - name: Record proof boundary
        run: |
          {
            echo "### Runtime proof boundary"
            echo
            echo "This workflow validates the controller and proof harness only."
            echo "It does not claim that any private runtime project was executed."
            echo "The fail-closed 18-project execution surface is runtime-all-18.yml via workflow_dispatch."
          } >> "$GITHUB_STEP_SUMMARY"
