name: oreslang-http-routing-reference-semantics

on:
  push:
    branches:
      - ci/oreslang-http-routing-ref-semantics-20261005

permissions:
  contents: read

jobs:
  route-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact compiler carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Verify exact compiler and router blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < _ci/http-routing/SOURCE_REF)" = "f849ba4dd60bf0dda87030ef8a40c273a71e60ea"
          test "$(tr -d '[:space:]' < _ci/http-routing/COMPILER_SOURCE_REF)" = "f849ba4dd60bf0dda87030ef8a40c273a71e60ea"
          while IFS=$'\t' read -r expected mode path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected"
          done < _ci/http-routing/COMPILER_BLOBS.tsv
          test "$(git hash-object _ci/http-routing/src/http_routing.ores)" = "7e448d4e13de1e0c163c73424c85b37b969aef3a"
          test "$(git hash-object _ci/http-routing/scripts/test.sh)" = "009efe2d617a35816f5a546d09c2b3514ecf34bc"
          test "$(git hash-object _ci/http-routing/tests/router_semantics.ores)" = "958c62354b2248aa9cd8ac97ee1da4a85d6891fb"
          test "$(git hash-object _ci/http-routing/tests/expected.txt)" = "7503dc249e06dba3432eb0d80ce560612d23f8d2"

      - name: Install Java 21 and Maven
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes openjdk-21-jdk maven
          JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 mvn -version

      - name: Compile exact Java-like-reference compiler
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          mvn -B -ntp -DskipTests compile

      - name: Run unchanged router semantics on current reference model
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          cat > "$RUNNER_TEMP/oreslang-compiler" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec mvn -B -ntp -q -DskipTests exec:java -Dexec.args="$*"
          SH
          chmod +x "$RUNNER_TEMP/oreslang-compiler"
          export ORESLANG_COMPILER="$RUNNER_TEMP/oreslang-compiler"
          bash _ci/http-routing/scripts/test.sh
