name: oreslang-pr68-v4-live

on:
  push:
    branches: ["ci/oreslang-pr68-v4-live"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation repo
        uses: actions/checkout@v4
      - name: Check out Oreslang PR 68 head
        uses: actions/checkout@v4
        with:
          repository: ores-truffle-oreslang/oreslang-source.java
          ref: feat/gc-private-shared-actors
          path: oreslang-source
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Confirm source revision
        working-directory: oreslang-source
        run: |
          test "$(git rev-parse HEAD)" = "3ec80a0006e93509ca90d89a93bc83763a0ce469"
          java --version
          mvn --version
      - name: GC focused tests
        working-directory: oreslang-source
        run: >-
          mvn -B -ntp
          -Dtest=GarbageCollectionHardeningTest,ActorRuntimeTest,ActorTransportHardeningTest,PrivateActorIsolationTest
          test
      - name: Full test suite
        working-directory: oreslang-source
        run: mvn -B -ntp test
