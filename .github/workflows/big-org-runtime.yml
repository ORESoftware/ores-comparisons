name: big-org-runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  topology-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Verify runtime topology authorities
        run: python3 scripts/verify_contract_authorities_static.py
      - name: Verify topology, org graph, and compose projection
        run: |
          python3 scripts/verify_big_org_runtime.py
          python3 scripts/generate_big_org_compose.py --check
      - name: Install exact pinned ores-compose
        shell: bash
        run: |
          set -euo pipefail
          rev="$(python3 - <<'PY'
          import json
          print(json.load(open("tools/toolchain.lock.json"))["tools"]["ores-compose"]["commit"])
          PY
          )"
          cargo install             --git https://github.com/ORESoftware/ores-compose             --rev "$rev"             --locked             --bin ores-compose
      - name: Check and plan all big-org local clusters
        shell: bash
        run: |
          set -euo pipefail
          for project in stacks/*/projects/big-org-example-*; do
            manifest="$project/repos/.github/.ores-compose.yaml"
            echo "==> $manifest"
            ores-compose check "$manifest"
            ores-compose plan "$manifest"
          done
