name: conformance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/check-layout.sh
      - run: ./scripts/check-project-bindings.sh
      - name: TypeSpec / JSON Schema differential conformance and projection generation
        run: ./scripts/check-contracts.sh
      - name: Assert decrypted env is not tracked
        run: |
          if git ls-files '*/env/dec/*' | grep -Ev '/(README.md|\.gitignore)$' | grep -q .; then
            echo 'decrypted env file is tracked' >&2
            exit 1
          fi
