name: oreslang-pr119-dynamicstruct-validation

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _ci/oreslang-pr119-full
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Runtime diagnostics
        run: |
          java --version
          mvn --version
          cat SOURCE_HEAD.txt
      - name: Compile exact source tree
        run: mvn -B -ntp -DskipTests compile
      - name: Run DynamicStruct regression
        run: mvn -B -ntp -Dtest=ReservedKeywordsDynamicStructTest test
