name: oreslang-inferred-typing-validation

on:
  push:
    branches: ["ci/oreslang-inferred-typing"]

permissions:
  contents: read

defaults:
  run:
    working-directory: _ci/oreslang-inferred-head

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Runtime diagnostics
        run: |
          java --version
          mvn --version
      - name: Full Maven verification
        run: mvn -B -ntp verify
