name: oreslang-gc-hardening-validation

on:
  push:
    branches: ["ci/oreslang-gc-hardening"]

permissions:
  contents: read

defaults:
  run:
    working-directory: _ci/oreslang-singleton-init

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Runtime diagnostics
        run: |
          java --version
          mvn --version
      - name: Compile all source
        run: mvn -B -ntp -DskipTests compile
      - name: GC + actor + ownership regression suite
        run: >-
          mvn -B -ntp
          -Dtest=GarbageCollectionRuntimeTest,ActorRuntimeTest,OwnershipAndClosureTest,IsolationHotReloadTest
          test
