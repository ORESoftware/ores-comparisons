name: oreslang-singleton-init-pr10-validation

on:
  push:
    branches: ["ci/oreslang-singleton-init-pr10"]

permissions:
  contents: read

defaults:
  run:
    working-directory: _ci/oreslang-singleton-init

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Runtime diagnostics
        run: |
          java --version
          mvn --version
      - name: Full Maven verification
        run: mvn -B -ntp verify
      - name: Run showcase
        run: mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
      - name: Run shared example
        run: mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"
