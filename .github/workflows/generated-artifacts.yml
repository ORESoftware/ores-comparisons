name: generated-artifact-integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-and-generated-interfaces:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Verify immutable action pins
        run: python3 scripts/verify_workflow_pins.py
      - name: Install generated-artifact validators
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client protobuf-compiler
          npm install --global typescript@5.9.3
      - name: Apply migrations and seeds twice
        run: python3 scripts/verify_postgres_contracts.py
      - name: Compile generated interfaces
        run: python3 scripts/verify_generated_interfaces.py
      - name: Check big-org repository contracts
        run: python3 scripts/verify_big_org_repos.py
      - name: Cargo-check ORES Stack big-org sibling repos
        run: python3 scripts/cargo_check_big_org_repos.py
