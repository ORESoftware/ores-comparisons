name: oreslang-actor-memory-keywords-validation

on:
  push:
    branches: ["ci/oreslang-actor-memory-keywords"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

defaults:
  run:
    working-directory: _ci/actor-memory-pr15

jobs:
  actor-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Runtime diagnostics
        run: |
          java --version
          mvn --version
      - name: Run actor memory, mutex, and isolation regression suite
        run: mvn -B -ntp test


  full-source-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Compile full actor-memory integration source tree
        working-directory: _ci/oreslang-pr19-full
        run: mvn -B -ntp -DskipTests compile
      - name: Run actor callable language tests
        working-directory: _ci/oreslang-pr19-full
        run: mvn -B -ntp -Dtest=ActorCallableKeywordTest,ActorInvocationRuntimeTest test
      - name: Run checked-in actor callable example
        working-directory: _ci/oreslang-pr19-full
        run: |
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/actor-callables.ores" | tee /tmp/oreslang-actor-callables.out
          grep -F "42:shared:isolated" /tmp/oreslang-actor-callables.out
