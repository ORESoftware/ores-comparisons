name: oreslang-actor-memory-pr15-validation

on:
  push:
    branches: ["ci/oreslang-actor-memory-pr15"]

permissions:
  contents: read

defaults:
  run:
    working-directory: _ci/actor-memory-pr15

jobs:
  actor-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Runtime diagnostics
        run: |
          java --version
          mvn --version
      - name: Run actor memory regression suite
        run: mvn -B -ntp test
