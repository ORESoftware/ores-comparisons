name: oreslang-pr68-gc-validation

on:
  push:
    branches: ["ci/oreslang-pr68-v4-mirror"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  full-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation repo
        uses: actions/checkout@v4
      - name: Check out exact Oreslang GC branch
        uses: actions/checkout@v4
        with:
          repository: ores-truffle-oreslang/oreslang-source.java
          ref: feat/gc-private-shared-actors
          path: oreslang-source
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Runtime diagnostics
        working-directory: oreslang-source
        run: |
          git rev-parse HEAD
          java --version
          mvn --version
      - name: Compile and test exact Oreslang PR 68 branch
        working-directory: oreslang-source
        run: mvn -B -ntp test
