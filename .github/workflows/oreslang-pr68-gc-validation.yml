name: oreslang-pr68-gc-validation

on:
  push:
    branches: ["ci/oreslang-pr68-v4-mirror"]
  pull_request:
    branches: ["main"]

concurrency:
  group: oreslang-pr68-v4-mirror
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: _ci/oreslang-pr57-full

jobs:
  gc-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify exact mirrored source
        run: grep -Fq "head b92d32849e2bbe7923154f41f457a79c6bf08e3f" SOURCE_HEAD.txt
      - name: GC and actor-isolation focused tests
        run: >-
          mvn -B -ntp
          -Dtest=GarbageCollectionHardeningTest,ActorRuntimeTest,ActorTransportHardeningTest,PrivateActorIsolationTest,SharedPrivateActorIsolationProofTest,OreslangActorIsolationExampleTest
          test

  gc-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify exact mirrored source
        run: grep -Fq "head b92d32849e2bbe7923154f41f457a79c6bf08e3f" SOURCE_HEAD.txt
      - name: Compile mirrored Oreslang
        run: mvn -B -ntp -q -DskipTests compile
      - name: Run GC language contract example
        run: |
          set +e
          output="$(mvn -B -ntp -DskipTests exec:java -Dexec.args=examples/demo-gc-contract.ores 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          grep -Fq "gc-contract-ok" <<<"$output"
          echo "GC DEMO PASS"

  full-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify exact mirrored source
        run: grep -Fq "head b92d32849e2bbe7923154f41f457a79c6bf08e3f" SOURCE_HEAD.txt
      - name: Full Maven test suite
        run: mvn -B -ntp test
