name: oreslang-pr68-gc-validation

on:
  push:
    branches: ["ci/oreslang-pr68-gc-validation"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

defaults:
  run:
    working-directory: _ci/oreslang-pr57-full

jobs:
  gc-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: GC and actor-isolation focused tests
        run: >-
          mvn -B -ntp
          -Dtest=GarbageCollectionHardeningTest,ActorRuntimeTest,ActorTransportHardeningTest,PrivateActorIsolationTest,SharedPrivateActorIsolationProofTest
          test


  gc-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation repo
        uses: actions/checkout@v4
      - name: Check out Oreslang demo
        uses: actions/checkout@v4
        with:
          repository: ores-truffle-oreslang/oreslang-demo
          ref: feat/gc-examples
          path: demo
      - name: Check out exact Oreslang PR 68 head
        uses: actions/checkout@v4
        with:
          repository: ores-truffle-oreslang/oreslang-source.java
          ref: 5efe3c7149ec32d3d0114aabdf4cd1ede3c7ae0e
          path: source
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Run GC example contract
        run: |
          cd "$GITHUB_WORKSPACE"
          ORESLANG_SOURCE_DIR="$GITHUB_WORKSPACE/source" \
            bash demo/scripts/run.sh demo/examples/keywords/12_gc_contract.ores

  full-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Runtime diagnostics
        run: |
          java --version
          mvn --version
      - name: Compile and test exact Oreslang PR 68 snapshot
        run: mvn -B -ntp test
