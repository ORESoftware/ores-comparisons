name: rx-callbacks pointerless validation

on:
  push:
    branches:
      - test/rx-callbacks-pointerless-20261006

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify compiler tree provenance
        shell: bash
        run: |
          BASE=466a1fe879b2fc68d61a81625a0971d52153135e
          test "$(git rev-parse "$BASE^{tree}")" = "aee041ea71075d9d6a6349e4d7e9b989c2bbeb91" || {
            echo "::error::carrier base is not exact oreslang-source PR #186 tree"
            exit 1
          }
          unexpected="$(git diff --name-only "$BASE" HEAD -- .             ':(exclude)validation/rx-callbacks/**'             ':(exclude).github/workflows/rx-callbacks-pointerless.yml')"
          if [ -n "$unexpected" ]; then
            echo "::error::compiler carrier was modified outside validation additions"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Build exact pointerless ownership compiler
        run: mvn -B -ntp -DskipTests package

      - name: Build runtime classpath
        run: mvn -q dependency:build-classpath -Dmdep.outputFile=.rx-callbacks-cp.txt

      - name: Execute callback operator regression
        shell: bash
        run: |
          CP="target/classes:$(cat .rx-callbacks-cp.txt)"
          JAVA=(java --enable-native-access=ALL-UNNAMED -Dpolyglot.engine.WarnInterpreterOnly=false -cp "$CP" dev.oreslang.launcher.OresMain)
          actual="$("${JAVA[@]}" validation/rx-callbacks/tests/operators.ores)"
          expected="$(cat validation/rx-callbacks/tests/operators.out)"
          if [ "$actual" != "$expected" ]; then
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual"
            exit 1
          fi

      - name: Execute common callback benchmark checksum
        shell: bash
        run: |
          CP="target/classes:$(cat .rx-callbacks-cp.txt)"
          JAVA=(java --enable-native-access=ALL-UNNAMED -Dpolyglot.engine.WarnInterpreterOnly=false -cp "$CP" dev.oreslang.launcher.OresMain)
          actual="$("${JAVA[@]}" validation/rx-callbacks/bench/pipeline.ores)"
          test "$actual" = "480000" || {
            echo "::error::expected benchmark checksum 480000, got '$actual'"
            exit 1
          }
