name: verify-comparisons

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88"
          components: rustfmt
      - run: python3 scripts/verify_workflow_pins.py
      - run: python3 scripts/verify_private_authority_credentials.py
      - run: python3 scripts/verify_project_matrix.py
      - name: Verify native source projects (offline ownership gate)
        run: |
          python3 scripts/verify_source_project_inventory.py
          python3 -m unittest tests.test_source_project_inventory
      - name: Compile, test, and execute Rust stack catalog gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          rustfmt --edition 2024 --check tools/verify_stack_catalog.rs tools/json_value.rs
          rustc --edition 2024 --test tools/verify_stack_catalog.rs -o tmp/verify-stack-catalog-tests
          ./tmp/verify-stack-catalog-tests
          rustc --edition 2024 tools/verify_stack_catalog.rs -o tmp/verify-stack-catalog
          ./tmp/verify-stack-catalog
      - name: Compile and mutation-test Rust runtime topology gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          rustc --edition 2024 --test tools/verify_runtime_topology.rs -o tmp/verify-runtime-topology-tests
          ./tmp/verify-runtime-topology-tests
      - run: python3 scripts/verify_dummy_org_map.py
      - run: python3 scripts/verify_dummy_org_gitlinks.py
      - run: python3 scripts/verify_runtime_fixture_org_map.py
      - run: python3 scripts/verify_oreslang_portability.py
      - run: python3 -m unittest tests.test_oreslang_portability_inventory
      - run: python3 scripts/render_runtime_fixture_gitmodules.py --check
      - run: python3 scripts/verify_runtime_fixture_gitlinks.py
      - run: python3 scripts/verify_graal_ruby_references.py
      - if: ${{ hashFiles('.gitmodules') == '' }}
        run: python3 scripts/verify_examples.py
      - run: python3 scripts/verify_project_repo_layout.py
      - run: python3 scripts/materialize_dummy_orgs.py
      - if: ${{ hashFiles('.gitmodules') == '' }}
        run: python3 scripts/verify_org_manifests.py
      - if: ${{ hashFiles('.gitmodules') == '' }}
        run: python3 scripts/verify_big_org_repos.py
      - run: python3 scripts/verify_toolchain_pins.py
      - run: python3 scripts/verify_adversarial_fixtures.py
      - name: Compile, mutation-test, and execute Rust fleet proof gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp artifacts
          rustfmt --edition 2024 --check tools/fleet_proof.rs
          rustc --edition 2024 --test tools/fleet_proof.rs -o tmp/fleet-proof-tests
          ./tmp/fleet-proof-tests
          rustc --edition 2024 tools/fleet_proof.rs -o tmp/fleet-proof
          ./tmp/fleet-proof > artifacts/fleet-proof.json
      - name: Upload fleet proof receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-proof
          path: artifacts/fleet-proof.json
          if-no-files-found: error
          retention-days: 30
      - run: python3 scripts/verify_ores_stack_cli_hardening.py
      - run: python3 scripts/verify_server_compatibility.py
      - run: python3 scripts/verify_server_startup_policy.py
      - run: python3 -m unittest tests.test_server_compatibility tests.test_server_startup_policy
      - run: python3 scripts/verify_ores_stack_cli_integrity.py
      - run: python3 scripts/verify_ores_stack_cli_release_safety.py
      - run: python3 scripts/generate_ores_stack_server_inventory.py --check
      - run: python3 scripts/verify_real_server_inventory.py
      - run: python3 -m unittest tests.test_adversarial_fixtures tests.test_ores_stack_cli_hardening tests.test_ores_stack_cli_integrity tests.test_ores_stack_cli_release_safety tests.test_ores_stack_clean_machine tests.test_ores_stack_toolchain_switch
      - if: ${{ hashFiles('.gitmodules') == '' }}
        run: python3 scripts/verify_contract_authorities_static.py
      - if: ${{ hashFiles('.gitmodules') == '' }}
        run: python3 scripts/verify_projection_contract.py
      - run: python3 scripts/verify_benchmark_matrix.py
      - if: ${{ hashFiles('.gitmodules') == '' }}
        run: python3 scripts/smoke_projects.py --check
      - name: Exercise benchmark recorder
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 18765 --bind 127.0.0.1 >/tmp/ores-comparisons-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18765/ >/dev/null; then break; fi
            sleep 0.1
          done
          python3 scripts/run_benchmark.py \
            --stack beamscale \
            --scenario http-observability \
            --url http://127.0.0.1:18765/ \
            --requests 5 \
            --warmup 1 \
            --pid "$server_pid" \
            --artifact README.md \
            --cost-per-million-usd 0.125 \
            --output benchmarks/results/benchmark-ci.json
          python3 scripts/render_benchmark_matrix.py --output benchmarks/results/matrix-ci.md
          grep -q "http-observability" benchmarks/results/matrix-ci.md
          rm -f benchmarks/results/benchmark-ci.json benchmarks/results/matrix-ci.md
      - if: ${{ hashFiles('.gitmodules') == '' }}
        run: python3 scripts/generate_all_contracts.py --check
      - name: Run per-project conformance drift gates
        if: ${{ hashFiles('.gitmodules') == '' }}
        run: |
          set -euo pipefail
          for project in stacks/*/projects/*/repos/.github/; do
            bash "$project/conformance/check.sh"
          done

  private-authorities:
    runs-on: ubuntu-latest
    outputs:
      has_private_read: ${{ steps.credential_coverage.outputs.cross_repo }}
      has_source_audit: ${{ steps.credential_coverage.outputs.source_audit }}
    env:
      CROSS_REPO_READ_TOKEN: ${{ secrets.COMPARISON_REPO_READ_TOKEN || secrets['cross-repo-token'] || secrets.ORES_CROSS_REPO_READ_TOKEN || secrets.TEST_FLEET_READ_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Report credential availability without exposing tokens
        id: credential_coverage
        shell: bash
        env:
          SOURCE_PROJECT_AUDIT_TOKEN: ${{ secrets.SOURCE_PROJECT_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${CROSS_REPO_READ_TOKEN:-}" ]]; then
            echo 'cross_repo=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'cross_repo=no' >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${SOURCE_PROJECT_AUDIT_TOKEN:-}" ]]; then
            echo 'source_audit=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'source_audit=no' >> "$GITHUB_OUTPUT"
          fi
      - name: Enumerate private upstream source projects when authorized
        shell: bash
        env:
          SOURCE_PROJECT_AUDIT_TOKEN: ${{ secrets.SOURCE_PROJECT_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_PROJECT_AUDIT_TOKEN:-}" ]]; then
            echo "::notice::private native source enumeration NOT checked: SOURCE_PROJECT_AUDIT_TOKEN not configured"
          else
            python3 scripts/verify_source_project_inventory.py --remote
          fi
      - name: Run exact private authorities and stack smoke tests when authorized
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CROSS_REPO_READ_TOKEN:-}" ]]; then
            echo "::notice::no established cross-repository read credential is configured; mandatory static gates still ran, private cross-repo gates are skipped."
            exit 0
          fi

          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${CROSS_REPO_READ_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"

          # Migration-era proof for clean-environment installation and rollback.
          # These immutable historical commits are evidence fixtures only and
          # explicitly do not count as canonical release proof.
          python3 scripts/verify_ores_stack_cli_release_safety.py \
            --exercise \
            --repository https://github.com/ORESoftware/ores-stack \
            --previous d46c07e0f91c2dbda9b2fee64bdd82f6d52fc1ef \
            --candidate 2fd66cfaaf0d014f0e27cf29eae6a943928724c5 \
            --receipt artifacts/ores-stack-cli-release-safety.json

          bash scripts/bootstrap_pinned_tools.sh
          export PATH="$PWD/.local/bin:$PATH"

          zed task list
          zed task run check

          if [[ -f .gitmodules ]]; then
            zed install --git-submodules
          fi

          bash scripts/verify_fresh_clone_submodules.sh

          mkdir -p tmp
          rustc --edition 2024 tools/verify_stack_catalog.rs -o tmp/verify-stack-catalog
          ./tmp/verify-stack-catalog
          rustc --edition 2024 tools/verify_runtime_topology.rs -o tmp/verify-runtime-topology
          ./tmp/verify-runtime-topology
          python3 scripts/verify_dummy_org_map.py
          python3 scripts/verify_dummy_org_gitlinks.py
          python3 scripts/verify_runtime_fixture_org_map.py
          python3 scripts/verify_oreslang_portability.py
          python3 scripts/render_runtime_fixture_gitmodules.py --check
          python3 scripts/verify_runtime_fixture_gitlinks.py
          python3 scripts/verify_graal_ruby_references.py
          python3 scripts/verify_project_repo_layout.py
          python3 scripts/verify_examples.py
          python3 scripts/verify_org_manifests.py
          python3 scripts/verify_big_org_repos.py
          python3 scripts/verify_contract_authorities_static.py
          python3 scripts/verify_projection_contract.py
          python3 scripts/smoke_projects.py --check
          python3 scripts/generate_all_contracts.py --check

          bash conformance/check-all.sh

          for project in stacks/*/projects/*/repos/.github/; do
            echo "==> $project"
            ores-compose check "$project/.ores-compose.yaml"
            ores-compose plan "$project/.ores-compose.yaml"
          done

          python3 scripts/smoke_projects.py --execute
          bash scripts/build_big_org_repos.sh

  evidence-scope:
    name: audit actual verification scope
    if: ${{ always() }}
    needs: [static-contracts, private-authorities]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Mutation-test verification scope model
        run: python3 -m unittest tests.test_ci_evidence_receipt
      - name: Write incomplete or complete evidence report
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.static-contracts.result }}
          PRIVATE_RESULT: ${{ needs.private-authorities.result }}
          PRIVATE_AUTH: ${{ needs.private-authorities.outputs.has_private_read }}
          SOURCE_AUTH: ${{ needs.private-authorities.outputs.has_source_audit }}
          CHECKED_OUT_SHA: ${{ github.sha }}
          CHECKED_OUT_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Failed/skipped private jobs leave output unset: never upgrade unknown to yes.
          case "$PRIVATE_AUTH" in yes|no) ;; *) PRIVATE_AUTH=unknown ;; esac
          case "$SOURCE_AUTH" in yes|no) ;; *) SOURCE_AUTH=unknown ;; esac
          python3 scripts/ci_evidence_receipt.py \
            --static-result "$STATIC_RESULT" \
            --private-result "$PRIVATE_RESULT" \
            --private-auth "$PRIVATE_AUTH" \
            --source-auth "$SOURCE_AUTH" \
            --revision "$CHECKED_OUT_SHA" \
            --repository "$CHECKED_OUT_REPO"
      - name: Upload explicit CI scope receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-scope
          path: artifacts/ci-evidence-scope.json
          if-no-files-found: error
          retention-days: 30
