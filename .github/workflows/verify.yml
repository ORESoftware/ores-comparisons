name: verify-comparisons

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save @oresoftware/typespec-json-schema-validator@0.1.1
      - run: python3 scripts/verify_examples.py
      - run: python3 scripts/verify_toolchain_pins.py
      - run: python3 scripts/generate_all_contracts.py --check
      - run: bash conformance/check-all.sh

  compose-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install exact ores-compose pin
        run: |
          cargo install             --git https://github.com/ORESoftware/ores-compose             --rev fbfad966f9770a9a8d3895880523280324b4ddc6             --locked             --bin ores-compose
      - name: Validate all local clusters
        run: |
          set -euo pipefail
          for project in stacks/*/projects/*; do
            echo "==> $project"
            ores-compose check "$project/.ores-compose.yaml"
            ores-compose plan "$project/.ores-compose.yaml"
          done
