name: oreslang-mixed-java-ores-validation

on:
  push:
    branches: ["ci/oreslang-mixed-java-ores-20261003"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

defaults:
  run:
    working-directory: _ci/oreslang-pr125-java-interop

jobs:
  java-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Runtime diagnostics
        run: |
          java --version
          mvn --version
      - name: Compile exact source mirror
        run: mvn -B -ntp -DskipTests compile
      - name: Run Java interop regression suite
        run: mvn -B -ntp -Dtest=HostImportTest,MixedSourceInteropTest test
      - name: Run direct Java import example
        run: |
          output="$(mvn -q -DskipTests -Dexec.args='--allow=JAVA_INTEROP --allow-host-class=java.util.ArrayList examples/java-interop.ores' exec:java)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q 'Java ArrayList size from Oreslang:'
          printf '%s\n' "$output" | grep -q '^2$'
