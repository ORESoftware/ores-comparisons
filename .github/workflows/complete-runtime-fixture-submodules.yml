name: complete runtime fixture submodules

on:
  push:
    branches:
      - chatgpt/complete-runtime-fixture-submodules-20261001
    paths:
      - '.github/workflows/complete-runtime-fixture-submodules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - name: Render complete runtime fixture .gitmodules projection
        run: python3 scripts/render_runtime_fixture_gitmodules.py
      - name: Verify complete runtime fixture projection
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render_runtime_fixture_gitmodules.py --check
          python3 scripts/verify_runtime_fixture_org_map.py
          python3 scripts/verify_runtime_fixture_gitlinks.py
          python3 scripts/verify_dummy_org_map.py
          python3 scripts/verify_dummy_org_gitlinks.py
          python3 scripts/verify_project_repo_layout.py
      - name: Commit generated .gitmodules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitmodules
          if git diff --cached --quiet; then
            echo 'runtime fixture .gitmodules already complete'
            exit 0
          fi
          git commit -m 'feat: render complete runtime fixture submodule fleet'
          git push origin HEAD:${GITHUB_REF_NAME}
