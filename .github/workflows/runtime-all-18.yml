name: runtime-all-18

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-all-18.yml"
      - ".github/workflows/runtime-project.yml"
      - "scripts/prove_runtime_project.py"
      - "scripts/bootstrap_pinned_tools.sh"
      - "tools/toolchain.lock.json"
      - "tools/README.md"
      - "shared/project-matrix.json"
      - ".gitmodules"
      - "stacks/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-all-18.yml"
      - ".github/workflows/runtime-project.yml"
      - "scripts/prove_runtime_project.py"
      - "scripts/bootstrap_pinned_tools.sh"
      - "tools/toolchain.lock.json"
      - "tools/README.md"
      - "shared/project-matrix.json"
      - ".gitmodules"
      - "stacks/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-all-18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate proof harness and exact 18-project authority
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prove_runtime_project.py
          python3 scripts/verify_project_matrix.py
          python3 - <<'PY'
          import json
          matrix = json.load(open("shared/project-matrix.json"))
          projects = matrix["projects"]
          stacks = {"beamscale", "scintilla-run", "ores-stack"}
          scenarios = {
              "cached-rpc",
              "http-observability",
              "forms-chat-workflow",
              "big-org-example-commerce",
              "big-org-example-collaboration",
              "big-org-example-operations",
          }
          assert len(projects) == 18, len(projects)
          assert {p["stack"] for p in projects} == stacks
          assert {p["scenario"] for p in projects} == scenarios
          for scenario in scenarios:
              actual = {p["stack"] for p in projects if p["scenario"] == scenario}
              assert actual == stacks, (scenario, actual)
          print("runtime matrix authority OK: 6 waves x 3 stacks = 18 projects")
          PY

  cached-rpc:
    name: wave 1 cached-rpc / ${{ matrix.stack }}
    needs: harness-preflight
    strategy:
      fail-fast: false
      matrix:
        stack: [beamscale, scintilla-run, ores-stack]
    uses: ./.github/workflows/runtime-project.yml
    with:
      stack: ${{ matrix.stack }}
      scenario: cached-rpc
    secrets: inherit

  http-observability:
    name: wave 2 http-observability / ${{ matrix.stack }}
    needs: cached-rpc
    strategy:
      fail-fast: false
      matrix:
        stack: [beamscale, scintilla-run, ores-stack]
    uses: ./.github/workflows/runtime-project.yml
    with:
      stack: ${{ matrix.stack }}
      scenario: http-observability
    secrets: inherit

  forms-chat-workflow:
    name: wave 3 forms-chat-workflow / ${{ matrix.stack }}
    needs: http-observability
    strategy:
      fail-fast: false
      matrix:
        stack: [beamscale, scintilla-run, ores-stack]
    uses: ./.github/workflows/runtime-project.yml
    with:
      stack: ${{ matrix.stack }}
      scenario: forms-chat-workflow
    secrets: inherit

  big-org-example-commerce:
    name: wave 4 big-org-example-commerce / ${{ matrix.stack }}
    needs: forms-chat-workflow
    strategy:
      fail-fast: false
      matrix:
        stack: [beamscale, scintilla-run, ores-stack]
    uses: ./.github/workflows/runtime-project.yml
    with:
      stack: ${{ matrix.stack }}
      scenario: big-org-example-commerce
    secrets: inherit

  big-org-example-collaboration:
    name: wave 5 big-org-example-collaboration / ${{ matrix.stack }}
    needs: big-org-example-commerce
    strategy:
      fail-fast: false
      matrix:
        stack: [beamscale, scintilla-run, ores-stack]
    uses: ./.github/workflows/runtime-project.yml
    with:
      stack: ${{ matrix.stack }}
      scenario: big-org-example-collaboration
    secrets: inherit

  big-org-example-operations:
    name: wave 6 big-org-example-operations / ${{ matrix.stack }}
    needs: big-org-example-collaboration
    strategy:
      fail-fast: false
      matrix:
        stack: [beamscale, scintilla-run, ores-stack]
    uses: ./.github/workflows/runtime-project.yml
    with:
      stack: ${{ matrix.stack }}
      scenario: big-org-example-operations
    secrets: inherit
