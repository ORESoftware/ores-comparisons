name: promote exact runtime authority pins

on:
  pull_request:
    branches: [hardening/GH-55-forward-runtime-secret]
    paths:
      - '.github/workflows/promote-runtime-authority-pins.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Promote only reviewed authority commits
        shell: bash
        env:
          CACHED_BEAM_SHA: 56199f5ba16e002efd821b46ed9e0a078bc76e09
          CACHED_ORES_SHA: 6dfbb6ab719dd99a546dfcd802994d515207bd18
          CACHED_SCINT_SHA: 5921312afd086594be2fc7426ea89ee942481cc3
          OPS_SCINT_SHA: 909d6e93f6428e61318a2f4dff5d39f4df050133
        run: |
          set -euo pipefail

          promote() {
            path="$1"
            sha="$2"
            git update-index --cacheinfo "160000,$sha,$path"
            tmp="$(mktemp)"
            jq --arg path "$path" --arg sha "$sha" \
              '(.entries[] | select(.path == $path) | .commit) = $sha' \
              shared/dummy-org-gitlinks.json > "$tmp"
            mv "$tmp" shared/dummy-org-gitlinks.json
          }

          promote stacks/beamscale/projects/cached-rpc/repos/.github "$CACHED_BEAM_SHA"
          promote stacks/ores-stack/projects/cached-rpc/repos/.github "$CACHED_ORES_SHA"
          promote stacks/scintilla-run/projects/cached-rpc/repos/.github "$CACHED_SCINT_SHA"
          promote stacks/scintilla-run/projects/big-org-example-operations/repos/.github "$OPS_SCINT_SHA"

          python3 scripts/generate_ores_stack_server_inventory.py
          git add shared/dummy-org-gitlinks.json conformance/ores-stack-cli/server-inventory.v1.json

          python3 scripts/verify_dummy_org_map.py
          python3 scripts/verify_dummy_org_gitlinks.py
          python3 scripts/verify_project_repo_layout.py
          python3 scripts/generate_ores_stack_server_inventory.py --check

          changed="$(git diff --cached --name-only)"
          expected="$(cat <<'EOF'
          conformance/ores-stack-cli/server-inventory.v1.json
          shared/dummy-org-gitlinks.json
          stacks/beamscale/projects/cached-rpc/repos/.github
          stacks/ores-stack/projects/cached-rpc/repos/.github
          stacks/scintilla-run/projects/big-org-example-operations/repos/.github
          stacks/scintilla-run/projects/cached-rpc/repos/.github
          EOF
          )"
          if [[ "$(printf '%s\n' "$changed" | sort)" != "$(printf '%s\n' "$expected" | sed 's/^          //' | sort)" ]]; then
            echo "unexpected promotion surface" >&2
            printf 'actual:\n%s\n' "$changed" >&2
            exit 1
          fi

      - name: Commit generated promotion
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "authority pins already promoted"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: promote hardened runtime authority pins'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
