name: contract-compatibility

on:
  pull_request:

permissions:
  contents: read

jobs:
  backward-compatibility:
    runs-on: ubuntu-latest
    env:
      COMPARISON_REPO_READ_TOKEN: ${{ secrets.COMPARISON_REPO_READ_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Unit-test compatibility rules
        run: python3 -m unittest -v tests.test_contract_compatibility
      - name: Initialize private comparison submodules when authorized
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .gitmodules ]]; then
            exit 0
          fi
          if [[ -z "${COMPARISON_REPO_READ_TOKEN:-}" ]]; then
            echo "SKIP_PRIVATE_CONTENT=true" >> "$GITHUB_ENV"
            echo "::notice::private comparison submodules are not authorized; cross-repo contract comparison is skipped."
            exit 0
          fi
          rewrite="url.https://x-access-token:${COMPARISON_REPO_READ_TOKEN}@github.com/.insteadOf"
          git config --global "$rewrite" "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive --checkout
          git config --global --unset-all "$rewrite" || true
      - name: Compare contracts with PR base
        if: env.SKIP_PRIVATE_CONTENT != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          python3 scripts/verify_contract_compatibility.py \
            --base-ref "origin/${GITHUB_BASE_REF}" \
            --receipt artifacts/contract-compatibility.json
      - name: Show compatibility receipt
        if: always()
        run: cat artifacts/contract-compatibility.json || true
