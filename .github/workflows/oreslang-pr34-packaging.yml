name: oreslang-pr34-packaging

on:
  push:
    branches: ["ci/oreslang-pr34-struct-hardening"]

permissions:
  contents: read

defaults:
  run:
    working-directory: _ci/oreslang-pr34-full

jobs:
  jvm-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - run: java --version
      - name: Verify JVM profile
        run: mvn -B -ntp verify
      - name: Run examples
        run: |
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"

  native-aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - run: native-image --version
      - name: Build AOT
        run: mvn -B -ntp -Pnative-aot -DskipTests package
      - name: Run AOT
        run: ./target/ores-aot --mode=aot --platform=linux examples/together.ores

  native-hybrid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - run: native-image --version
      - name: Build hybrid
        run: mvn -B -ntp -Pnative-hybrid -DskipTests package
      - name: Run hybrid
        run: ./target/ores-hybrid --mode=hybrid --platform=linux examples/together.ores

  polyglot-isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - run: native-image --version
      - name: Build isolate
        run: mvn -B -ntp -Pnative-isolate -DskipTests package
      - name: Locate isolate
        id: isolate
        shell: bash
        run: |
          lib="$(find target -maxdepth 1 -type f \( -name 'oresvm.so' -o -name 'liboresvm.so' -o -name 'oresvm.dylib' -o -name 'liboresvm.dylib' \) | head -n1)"
          test -n "$lib"
          echo "path=$PWD/$lib" >> "$GITHUB_OUTPUT"
      - name: Run isolate
        run: mvn -B -ntp -Dpolyglot.engine.IsolateLibrary="${{ steps.isolate.outputs.path }}" -DskipTests exec:java -Dexec.args="--strict-isolate --mode=jit --platform=linux examples/together.ores"
