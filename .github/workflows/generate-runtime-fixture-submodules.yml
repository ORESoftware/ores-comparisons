name: generate runtime fixture submodules

on:
  push:
    branches:
      - chatgpt/private-runtime-submodules-20261001
    paths:
      - 'shared/runtime-fixture-submodules.json'
      - 'scripts/render_runtime_fixture_gitmodules.py'
      - '.github/workflows/generate-runtime-fixture-submodules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Render .gitmodules
        run: python3 scripts/render_runtime_fixture_gitmodules.py
      - name: Commit generated metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .gitmodules; then
            echo 'runtime fixture .gitmodules already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitmodules
          git commit -m 'chore: materialize private runtime submodules'
          git push origin HEAD:${GITHUB_REF_NAME}
