name: runtime fixture orgs

on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'shared/dummy-org-fleet.json'
      - 'shared/runtime-fixture-submodules.json'
      - 'shared/stack-catalog.json'
      - 'scripts/render_runtime_fixture_gitmodules.py'
      - 'scripts/verify_runtime_fixture_org_map.py'
      - 'scripts/verify_runtime_fixture_gitlinks.py'
      - 'scripts/verify_runtime_fixture_remote_reachability.py'
      - 'scripts/verify_dummy_org_map.py'
      - 'scripts/verify_dummy_org_gitlinks.py'
      - 'scripts/verify_project_repo_layout.py'
      - 'docs/DUMMY-ORG-FLEET.md'
      - 'stacks/**/fixtures/README.md'
      - '.github/workflows/runtime-fixture-orgs.yml'
  push:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'shared/dummy-org-fleet.json'
      - 'shared/runtime-fixture-submodules.json'
      - 'shared/stack-catalog.json'
      - 'scripts/render_runtime_fixture_gitmodules.py'
      - 'scripts/verify_runtime_fixture_org_map.py'
      - 'scripts/verify_runtime_fixture_gitlinks.py'
      - 'scripts/verify_runtime_fixture_remote_reachability.py'
      - 'scripts/verify_dummy_org_map.py'
      - 'scripts/verify_dummy_org_gitlinks.py'
      - 'scripts/verify_project_repo_layout.py'
      - 'docs/DUMMY-ORG-FLEET.md'
      - 'stacks/**/fixtures/README.md'
      - '.github/workflows/runtime-fixture-orgs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-topology:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify dummy-org fleet topology
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_runtime_fixture_org_map.py
          python3 scripts/render_runtime_fixture_gitmodules.py --check
          python3 scripts/verify_runtime_fixture_gitlinks.py
          python3 scripts/verify_dummy_org_map.py
          python3 scripts/verify_dummy_org_gitlinks.py
          python3 scripts/verify_project_repo_layout.py

  remote-reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CROSS_REPO_READ_TOKEN: ${{ secrets.COMPARISON_REPO_READ_TOKEN || secrets['cross-repo-token'] || secrets.ORES_CROSS_REPO_READ_TOKEN || secrets.TEST_FLEET_READ_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify materialized private fixture repositories
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CROSS_REPO_READ_TOKEN:-}" ]]; then
            echo "::notice::no established cross-repository read credential is configured; offline gitlink verification remains mandatory and private remote reachability is skipped."
            exit 0
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${CROSS_REPO_READ_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          python3 scripts/verify_runtime_fixture_remote_reachability.py
