name: oreslang-gpu-cross-org-validation

on:
  push:
    branches: ["ci/oreslang-gpu-pr13"]

permissions:
  contents: read

concurrency:
  group: oreslang-gpu-cross-org-validation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: _ci/oreslang

jobs:
  polyglot-isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Build Oreslang polyglot isolate library
        run: mvn -B -ntp -Pnative-isolate -DskipTests package
      - name: Locate isolate library
        id: isolate
        shell: bash
        run: |
          lib="$PWD/target/oresvm.so"
          test -f "$lib"
          echo "path=$lib" >> "$GITHUB_OUTPUT"
      - name: Run strict program in Oreslang polyglot isolate
        run: mvn -B -ntp -Dpolyglot.engine.IsolateLibrary="${{ steps.isolate.outputs.path }}" -DskipTests exec:java -Dexec.args="--strict-isolate --mode=jit --platform=linux examples/together.ores"
