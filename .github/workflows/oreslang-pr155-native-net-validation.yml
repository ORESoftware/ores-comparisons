name: oreslang-pr155-native-net-validation

on:
  push:
    branches: ["ci/oreslang-pr155-native-net-46948a3c-20261003"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

defaults:
  run:
    working-directory: _ci/oreslang-pr155-native-net

jobs:
  exact-tree-native-net:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Prove exact mirrored source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat SOURCE_HEAD.txt)" = "d309d8fa01e5f3d1029399f92ad69241a55b6b0d"
          test "$(cat SOURCE_TREE.txt)" = "d309d8fa01e5f3d1029399f92ad69241a55b6b0d"
          while IFS=$'\t' read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            }
          done < SOURCE_BLOBS.tsv
          test "$(wc -l < SOURCE_BLOBS.tsv | tr -d ' ')" = "91"
      - name: Compile exact source mirror
        run: mvn -B -ntp -DskipTests compile
      - name: Run native handle and boundary suites
        run: mvn -B -ntp -Dtest=NativeSocketHandleTest,NativeSocketBridgeTest,NativeNetOreslangBoundaryTest test
      - name: Run native networking functional regressions
        run: >-
          mvn -B -ntp
          -Dtest=NativeNetworkingLanguageTest#
          test
      - name: Run all other test classes
        run: mvn -B -ntp -Dtest='*Test,!NativeNetworkingLanguageTest' test
