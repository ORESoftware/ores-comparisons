name: contracts-local-dev

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.9.0"
      - name: Install pinned contract toolchain
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeSpec and JSON Schema parity
        run: |
          mkdir -p artifacts
          npm run contracts:parity
      - name: Generated projection drift
        run: npm run contracts:generated-check
      - name: Project layout conformance
        run: npm run contracts:layout
      - name: Shell syntax
        run: bash -n scripts/local/*.sh scripts/install-ores-compose.sh
