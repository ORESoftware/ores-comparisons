name: runtime-project

on:
  workflow_call:
    inputs:
      stack:
        description: Comparison stack identifier.
        required: true
        type: string
      scenario:
        description: Comparison scenario identifier.
        required: true
        type: string
    secrets:
      COMPARISON_REPO_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  runtime:
    name: ${{ inputs.stack }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      STACK: ${{ inputs.stack }}
      SCENARIO: ${{ inputs.scenario }}

    steps:
      - name: Require private cross-repository execution credential
        shell: bash
        env:
          COMPARISON_REPO_READ_TOKEN: ${{ secrets.COMPARISON_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${COMPARISON_REPO_READ_TOKEN:-}" ]]; then
            echo "::error title=Infrastructure blocked::COMPARISON_REPO_READ_TOKEN is not configured; executable runtime proof requires read-only access to the private dummy-org and stack-tool repositories."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "29.1.1"
          gleam-version: "1.18.1"

      - name: Validate requested matrix member
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          matrix = json.load(open("shared/project-matrix.json"))
          stack = os.environ["STACK"]
          scenario = os.environ["SCENARIO"]
          matches = [
              p for p in matrix["projects"]
              if p["stack"] == stack and p["scenario"] == scenario
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected one governed matrix entry for {stack}/{scenario}; got {len(matches)}"
              )
          print(f"governed runtime target: {stack}/{scenario}")
          PY

      - name: Configure read-only private repository access
        shell: bash
        env:
          COMPARISON_REPO_READ_TOKEN: ${{ secrets.COMPARISON_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          git config --global             "url.https://x-access-token:${COMPARISON_REPO_READ_TOKEN}@github.com/.insteadOf"             "https://github.com/"

      - name: Initialize target project's exact gitlinks
        shell: bash
        run: |
          set -euo pipefail
          prefix="stacks/${STACK}/projects/${SCENARIO}/repos/"
          mapfile -t paths < <(
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' |
              awk '{print $2}' |
              grep -F "$prefix"
          )
          if (( ${#paths[@]} == 0 )); then
            echo "::error::no governed submodules found below $prefix"
            exit 1
          fi
          printf 'initializing %s\n' "${paths[@]}"
          git submodule sync -- "${paths[@]}"
          git submodule update --init --recursive --checkout -- "${paths[@]}"

      - name: Install host runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16 protobuf-compiler rebar3
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Bootstrap exact-pinned comparison toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          bash scripts/bootstrap_pinned_tools.sh
          echo "$PWD/.local/bin" >> "$GITHUB_PATH"

      - name: Check and plan exact compose graph
        shell: bash
        run: |
          set -euo pipefail
          config="stacks/${STACK}/projects/${SCENARIO}/repos/.github/.ores-compose.yaml"
          test -f "$config"
          ./.local/bin/ores-compose check "$config"
          ./.local/bin/ores-compose plan "$config"

      - name: Start infra and application and prove compose_ready
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PWD/.local/bin:$PATH"
          python3 scripts/prove_runtime_project.py             --stack "$STACK"             --scenario "$SCENARIO"             --ready-timeout 600             --shutdown-timeout 45

      - name: Print runtime receipt
        if: always()
        shell: bash
        run: |
          receipt="artifacts/runtime-18/${STACK}-${SCENARIO}.json"
          if [[ -f "$receipt" ]]; then
            cat "$receipt"
          else
            echo "::notice::runtime receipt was not created; failure happened before ores-compose execution"
          fi

      - name: Remove private repository credential
        if: always()
        shell: bash
        env:
          COMPARISON_REPO_READ_TOKEN: ${{ secrets.COMPARISON_REPO_READ_TOKEN }}
        run: |
          git config --global --unset-all             "url.https://x-access-token:${COMPARISON_REPO_READ_TOKEN}@github.com/.insteadOf"             >/dev/null 2>&1 || true
